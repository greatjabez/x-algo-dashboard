name: 매일 업데이트

on:
  schedule:
    - cron: "0 21 * * *"   # 매일 06:00 한국 시간 (21:00 UTC)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 알고리즘 저장소 받기
        run: git clone -q https://github.com/xai-org/x-algorithm.git .src
      - name: 사이트 생성
        run: python generate.py --src .src --no-fetch
      - name: 기록 저장 (main)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add state
          if git diff --cached --quiet; then echo "변경 없음"; else git commit -m "기록 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')" && git pull --rebase -q && git push; fi
      - name: 사이트 배포 (gh-pages)
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "사이트 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
